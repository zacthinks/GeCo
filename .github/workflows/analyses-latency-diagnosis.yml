name: Analyses 300k latency diagnosis (opt-in)

on:
  push:
    branches:
      - perf/analyses-300k-diagnosis
    paths:
      - '.github/workflows/analyses-latency-diagnosis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install pinned environment
        run: uv sync --all-extras --group dev
      - name: Collect reproducibility metadata
        run: |
          mkdir -p diagnostic-results
          git rev-parse HEAD > diagnostic-results/source-sha.txt
          uname -a > diagnostic-results/uname.txt
          lscpu > diagnostic-results/cpu.txt
          .venv/bin/python -m pip --version || true
          uv pip freeze --python .venv/bin/python > diagnostic-results/dependencies.txt
      - name: Run independent-process untraced and traced comparisons
        shell: bash
        run: |
          set -euo pipefail
          for units in 10000 50000 300000; do
            for round in 1 2 3; do
              for mode in untraced traced; do
                echo "::group::size=$units round=$round mode=$mode"
                .venv/bin/python -m benchmarks.analyses_latency_diagnosis \
                  --units "$units" --round "$round" --mode "$mode" \
                  --output "diagnostic-results/$units-$round-$mode.json" \
                  | tee "diagnostic-results/$units-$round-$mode.log"
                echo "::endgroup::"
              done
            done
          done
      - name: Profile actual 50k and 300k hot paths
        shell: bash
        if: success()
        run: |
          set -euo pipefail
          for units in 50000 300000; do
            for chart in correlation unified_bar histogram_quantile scatter; do
              echo "::group::profile=$units/$chart"
              .venv/bin/python -m benchmarks.analyses_latency_diagnosis \
                --units "$units" --round 1 --mode untraced --case "$chart" --profile \
                --output "diagnostic-results/profile-$units-$chart.json" \
                | tee "diagnostic-results/profile-$units-$chart.log"
              echo "::endgroup::"
            done
          done
      - name: Save raw results and profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyses-latency-diagnosis-${{ github.run_id }}
          path: diagnostic-results/
          retention-days: 30
