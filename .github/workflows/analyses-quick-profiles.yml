name: Analyses quick profiling (opt-in)
on:
  push:
    branches:
      - perf/analyses-300k-diagnosis
    paths:
      - '.github/workflows/analyses-quick-profiles.yml'
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --all-extras --group dev
      - name: Run baseline 10k and 50k plus profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quick-results
          git rev-parse HEAD > quick-results/revision.txt
          for units in 10000 50000; do
            for mode in untraced traced; do
              .venv/bin/python -m benchmarks.analyses_latency_diagnosis \
                --units "$units" --round 1 --mode "$mode" \
                --output "quick-results/$units-$mode.json" \
                | tee "quick-results/$units-$mode.log"
            done
          done
          for chart in correlation unified_bar histogram_quantile scatter summary_mean; do
            .venv/bin/python -m benchmarks.analyses_latency_diagnosis \
              --units 50000 --round 2 --mode untraced --case "$chart" --profile \
              --output "quick-results/profile-$chart.json" \
              | tee "quick-results/profile-$chart.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyses-quick-profiles-${{ github.run_id }}
          path: quick-results/
          retention-days: 30
