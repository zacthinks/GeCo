name: Analyses 300k candidate parity (opt-in)
on:
  push:
    branches:
      - perf/analyses-300k-diagnosis
    paths:
      - '.github/workflows/analyses-300k-candidate-parity.yml'
permissions:
  contents: read
jobs:
  original-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --group dev
      - name: Verify nine original chart oracles and Plotly payload bounds at 300k
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parity-results
          git rev-parse HEAD > parity-results/source-sha.txt
          /usr/bin/time -v -o parity-results/process-memory.txt \
            .venv/bin/python benchmarks/analyses_300k.py --units 300000 \
            > parity-results/analyses-300k.json
          .venv/bin/python - <<'PY'
          import json
          report=json.load(open('parity-results/analyses-300k.json'))
          assert report['observations']==300000
          assert len(report['charts'])==9
          print('Nine 300k chart oracles passed:', list(report['charts']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyses-300k-candidate-parity-${{ github.run_id }}
          path: parity-results/
          retention-days: 30
