name: Demo Cloud Run preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - demo/**
      - tests/test_demo_router.py
      - .github/workflows/demo-cloudrun-preview.yml

jobs:
  demo-container:
    name: Container build and session smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build demo image
        run: docker build --tag geco-demo:ci .
      - name: Start demo container
        run: |
          docker run --detach --name geco-demo --publish 18080:8080 \
            --memory 2g --cpus 2 geco-demo:ci
      - name: Verify health, session creation, and Dash routing
        run: |
          set -eu
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/__demo/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/ | grep -q "temporary synthetic"
          curl --fail --silent --show-error --cookie-jar /tmp/geco-demo-cookie \
            --data '' --output /dev/null http://127.0.0.1:18080/__demo/start
          curl --fail --silent --show-error --cookie /tmp/geco-demo-cookie \
            http://127.0.0.1:18080/_dash-layout >/tmp/geco-layout.json
          curl --fail --silent --show-error --cookie /tmp/geco-demo-cookie \
            http://127.0.0.1:18080/_dash-dependencies >/tmp/geco-dependencies.json
          curl --fail --silent --show-error --cookie /tmp/geco-demo-cookie \
            --data '' --output /dev/null http://127.0.0.1:18080/__demo/end
      - name: Container logs on failure
        if: failure()
        run: docker logs geco-demo || true
      - name: Cleanup
        if: always()
        run: docker rm --force geco-demo || true
