name: Phase 2A Runtime Pilot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - main
    paths:
      - benchmarks/phase2a_runtime_pilot.py
      - .github/workflows/phase2a-runtime-pilot.yml

jobs:
  runtime-pilot:
    name: Dashboard and Focus workload pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install GeCo and all dependencies
        run: uv sync --all-extras

      - name: Capture Dash and Focus pilot evidence
        run: >
          uv run python benchmarks/phase2a_runtime_pilot.py
          --sizes 1000 10000 --repeats 8
          --output phase2a-runtime-pilot.json

      - name: Archive diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-runtime-pilot
          path: phase2a-runtime-pilot.json
          if-no-files-found: warn
