name: Tests

on:
  # Test proposed changes once through the PR. Restrict push builds to the
  # integration/release branches so feature-branch pushes do not run duplicate CI.
  push:
    branches:
      - main
      - analyses
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out TeAL for linked integration tests
        uses: actions/checkout@v7
        with:
          repository: zacthinks/text-analysis-lab
          ref: main
          path: _teal

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install GeCo and all dependencies
        run: uv sync --all-extras

      - name: Browser-level Scale, legacy Analyses and numerical editor regressions
        run: |
          uv run --with playwright python -c "import shutil; import playwright.sync_api; assert any(shutil.which(name) for name in ('google-chrome', 'chromium', 'chromium-browser')), 'Chrome/Chromium is required for browser regression tests'"
          uv run --with playwright pytest -q -rs tests/test_scale_prediction_browser.py tests/test_analysis_roles_browser.py tests/test_analysis_continuous_browser.py

      - name: Upload browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-prediction-browser-screenshots
          path: scale-prediction-browser-*.png
          if-no-files-found: ignore

      - name: Install TeAL in the GeCo test environment
        run: uv pip install --python .venv/bin/python -e ./_teal

      - name: Verify TeAL can be imported
        run: uv run --no-sync python -c "import text_analysis_lab; import geometric_coder; print(text_analysis_lab.__file__)"

      - name: Run pytest with TeAL available
        run: uv run --no-sync pytest -q -rs

      - name: Benchmark 300k Scale candidate sampling
        run: uv run --no-sync python benchmarks/candidate_sampling_300k.py --units 300000 --budget 1000

      - name: Benchmark 300k continuous Analyses charts and browser payload bounds
        run: uv run --no-sync python benchmarks/analyses_300k.py --units 300000
