name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install GeCo and all dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest -q -rs

      - name: Browser-level Scale prediction preview regression
        run: uv run --with playwright pytest -q -rs tests/test_scale_prediction_browser.py

      - name: Benchmark 300k Scale candidate sampling
        run: uv run python benchmarks/candidate_sampling_300k.py --units 300000 --budget 1000
